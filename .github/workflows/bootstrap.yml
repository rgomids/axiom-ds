name: Repository bootstrap
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check shared repository rules
        run: node -e "for (const p of ['LICENSE','AGENTS.md','SECURITY.md','docs/governance.md','docs/dependencies.md','docs/adr/0001-repository-boundary.md']) require('node:fs').accessSync(p)"
