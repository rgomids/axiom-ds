<section
  class="organic-workflow"
  id="fluxo"
  aria-label="Revelação dos caminhos do workflow"
  data-en-aria="Workflow path reveal"
>
  <div class="stage">
    <div class="stage-heading">
      <p class="eyebrow" data-en="ONE CORE. MANY PATHS.">UM NÚCLEO. VÁRIOS CAMINHOS.</p>
      <h2>
        <span data-en="Every workflow needs">Todo fluxo precisa</span><br /><span
          data-en="a center."
          >de um centro.</span
        >
      </h2>
      <p class="intro-line" data-en="Scroll to watch the work take shape.">
        Role para ver o trabalho ganhar forma.
      </p>
    </div>
    <figure
      class="organic-map"
      aria-label="Axiom conecta Specification, planos, implementação, validação, Evidence e aceite humano"
      data-en-aria="Axiom connects Specification, plans, implementation, validation, Evidence, and human acceptance"
    >
      <div class="ambient-light" aria-hidden="true"></div>
      <div class="map-orbit orbit-one" aria-hidden="true"></div>
      <div class="map-orbit orbit-two" aria-hidden="true"></div>
      <svg class="branches" viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="branch-gold" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="var(--axion-semantic-marketing-decoration-pathStart)" />
            <stop offset=".45" stop-color="var(--axion-semantic-marketing-decoration-pathMiddle)" />
            <stop offset="1" stop-color="var(--axion-semantic-marketing-decoration-pathEnd)" />
          </linearGradient>
        </defs>
        <g class="branch-glows">
          <path data-glow="0" />
          <path data-glow="1" />
          <path data-glow="2" />
          <path data-glow="3" />
          <path data-glow="4" />
          <path data-glow="5" />
        </g>
        <g class="branch-lines">
          <path data-path="0" pathLength="1" />
          <path data-path="1" pathLength="1" />
          <path data-path="2" pathLength="1" />
          <path data-path="3" pathLength="1" />
          <path data-path="4" pathLength="1" />
          <path data-path="5" pathLength="1" />
        </g>
      </svg>
      <div class="core-card">
        <span class="core-corner top-left"></span><span class="core-corner bottom-right"></span
        ><svg
          class="logo-lockup"
          viewBox="320 240 620 520"
          width="162"
          height="162"
          role="img"
          aria-label="Axiom"
        >
          <defs>
            <clipPath id="core-logo-crop">
              <rect x="320" y="240" width="620" height="520" />
            </clipPath>
          </defs>
          <image
            class="logo-artwork"
            clip-path="url(#core-logo-crop)"
            href="assets/axiom-logo.png"
            width="1254"
            height="1254"
          />
        </svg>
        <div class="core-rule"></div>
        <p>DEVELOPMENT CONTROL PLANE</p>
        <span class="core-context"
          ><i></i><span data-en=" Intent stays connected."> A intenção permanece.</span></span
        >
      </div>
      <div class="workflow-node" data-node="0" style="--x: 15%; --y: 20%">
        <span class="node-no">01</span>
        <div>
          <strong>Specification</strong
          ><small data-en="What to build. And why.">O que construir. E por quê.</small>
        </div>
        <span class="node-mark">↗</span>
      </div>
      <div class="workflow-node" data-node="1" style="--x: 14%; --y: 49%">
        <span class="node-no">02</span>
        <div>
          <strong data-en="Plan & ADRs">Plano e ADRs</strong
          ><small data-en="Decisions that endure.">Decisões que permanecem.</small>
        </div>
        <span class="node-mark">◇</span>
      </div>
      <div class="workflow-node" data-node="2" style="--x: 19%; --y: 80%">
        <span class="node-no">03</span>
        <div>
          <strong data-en="Implementation">Implementação</strong
          ><small data-en="Bounded execution.">Execução com limites.</small>
        </div>
        <span class="node-mark">&lt;/&gt;</span>
      </div>
      <div class="workflow-node" data-node="3" style="--x: 85%; --y: 20%">
        <span class="node-no">04</span>
        <div>
          <strong data-en="Validation & review">Validação e revisão</strong
          ><small data-en="Verify before concluding.">Verificar antes de concluir.</small>
        </div>
        <span class="node-mark">✓</span>
      </div>
      <div class="workflow-node" data-node="4" style="--x: 86%; --y: 49%">
        <span class="node-no">05</span>
        <div>
          <strong>Evidence</strong
          ><small data-en="Inspectable results.">Resultados inspecionáveis.</small>
        </div>
        <span class="node-mark">≡</span>
      </div>
      <div class="workflow-node" data-node="5" style="--x: 81%; --y: 80%">
        <span class="node-no">06</span>
        <div>
          <strong data-en="Human acceptance">Aceite humano</strong
          ><small data-en="The decision stays yours.">A decisão continua sua.</small>
        </div>
        <span class="node-mark">◎</span>
      </div>
      <figcaption>
        Fluxo conceitual · execução configurável e coordenação de agentes em entrega.
      </figcaption>
    </figure>
    <div class="narrative">
      <span class="narrative-count">00<span>/ 06</span></span>
      <div class="narrative-text">
        <h2>Antes dos caminhos, uma intenção.</h2>
        <p>O Axiom mantém o contexto no centro. Ao rolar, descubra como cada parte se conecta.</p>
      </div>
    </div>
    <div class="stage-bottom">
      <span class="scroll-hint"
        ><span data-en="EXPLORE AT YOUR OWN PACE ">EXPLORE NO SEU RITMO </span
        ><b><span data-en="↓">↓</span></b></span
      >
      <nav class="step-dots" aria-label="Caminhos do workflow" data-en-aria="Workflow paths">
        <a href="#caminho-1" aria-label="Specification"><span>01</span></a
        ><a href="#caminho-2" aria-label="Plano e ADRs" data-en-aria="Plan & ADRs"
          ><span>02</span></a
        ><a href="#caminho-3" aria-label="Implementação" data-en-aria="Implementation"
          ><span>03</span></a
        ><a href="#caminho-4" aria-label="Validação e revisão" data-en-aria="Validation & review"
          ><span>04</span></a
        ><a href="#caminho-5" aria-label="Evidence"><span>05</span></a
        ><a href="#caminho-6" aria-label="Aceite humano" data-en-aria="Human acceptance"
          ><span>06</span></a
        >
      </nav>
      <a href="#mapa-completo" class="full-map-link"
        ><span data-en="See full map ">Ver mapa completo </span
        ><span><span data-en="↘">↘</span></span></a
      >
    </div>
  </div>
  <div class="scroll-markers" aria-hidden="true">
    <span id="caminho-1"></span><span id="caminho-2"></span><span id="caminho-3"></span
    ><span id="caminho-4"></span><span id="caminho-5"></span><span id="caminho-6"></span
    ><span id="mapa-completo"></span>
  </div>
</section>
